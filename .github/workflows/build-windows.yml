# Compila el .exe de Windows en un runner limpio de GitHub, en vez de en la maquina del
# desarrollador. Dos motivos:
#
#  1. Reproducibilidad: el build sale siempre del codigo que esta en el repo, con las
#     dependencias declaradas en requirements.txt y nada mas -- no de lo que quedo
#     instalado en una maquina.
#  2. Firma de codigo: SignPath Foundation (firma gratis para proyectos open source)
#     EXIGE que el binario lo produzca un CI publico y verificable. Sin este workflow no
#     se puede ni pedir. Ver el paso "Firmar con SignPath" mas abajo, que queda
#     comentado hasta que aprueben el proyecto.
#
# Se dispara al publicar un tag "vX.Y.Z", o a mano desde la pestaña Actions.

name: Compilar el .exe de Windows

on:
  push:
    # Cada push a main compila. Se puede porque en repositorios PUBLICOS los minutos de
    # Actions son gratis e ilimitados -- no hay nada que ahorrar. Y compilar siempre
    # tiene su propio valor: avisa el mismo dia si un cambio rompio el empaquetado, en
    # vez de descubrirlo semanas despues, al ir a publicar.
    branches: ["main"]
    # Un tag vX.Y.Z ademas publica el release (ver el ultimo paso).
    tags: ["v*"]
  # Y siempre queda el boton "Run workflow" en la pestaña Actions para lanzarlo a mano.
  workflow_dispatch: {}

permissions:
  contents: write   # solo para poder crear el release al correr sobre un tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          # 3.8 NO es un descuido: es la misma version sobre la que corre y se probo la
          # app. OpenCV 5 exige numpy>=2 a partir de Python 3.9 (regla que trae en su
          # propia metadata), y numpy 2 no es compatible con el pandas 2.0.3 que usa
          # esto. O sea que compilar en 3.9+ obliga a cambiar TODO el stack de numeros
          # y a re-validar la extraccion de datos desde cero.
          # Cuando se migre a numpy 2, se sube esta version junto con pandas.
          python-version: "3.8"
          cache: pip

      # OJO: cada comando verifica su codigo de salida. En pwsh, un ejecutable que falla
      # NO corta el script -- solo cuenta el codigo del ULTIMO comando del paso. Eso ya
      # dejo pasar dos builds rotos: un pip que abortaba por conflicto de versiones y un
      # motor de OCR que no arrancaba, ambos con el paso en verde.
      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Fallo la actualizacion de pip" }

          pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Fallo la instalacion de requirements.txt" }

          # PyInstaller va CLAVADO a la version con la que se probo AuditoriaCedulas.spec:
          # entre versiones mayores cambian las opciones del .spec (en la 6 se quito el
          # cifrado del PYZ, por ejemplo), y un build que se rompe solo porque salio una
          # version nueva es justo lo que este workflow tiene que evitar.
          pip install pyinstaller==6.22.2
          if ($LASTEXITCODE -ne 0) { throw "Fallo la instalacion de PyInstaller" }

      - name: Revisar que quedo instalado lo que se pidio
        shell: pwsh
        run: |
          # Un "pip install" a medias es invisible hasta que la app falla en la maquina
          # del usuario. Aca se confirma que lo critico quedo, y con que version.
          python -c "import numpy, pandas, cv2, onnxruntime, fitz, rapidocr; print('numpy', numpy.__version__); print('pandas', pandas.__version__); print('cv2', cv2.__version__); print('onnxruntime', onnxruntime.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Falta alguna dependencia critica" }

          # pywebview es lo que abre la ventana de la app (y lo que permite apagarla al
          # cerrarla). Se importa aparte porque en Windows arrastra pythonnet, que es
          # justo el tipo de dependencia que se instala a medias sin avisar.
          # La version se pide con importlib.metadata y no con webview.__version__:
          # pywebview no expone ese atributo, y preguntarlo hacia fallar el chequeo
          # aunque la libreria estuviera perfectamente instalada.
          python -c "import webview, clr, importlib.metadata as md; print('pywebview', md.version('pywebview'))"
          if ($LASTEXITCODE -ne 0) { throw "pywebview/pythonnet no quedaron instalados" }

      - name: Descargar poppler
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # El .exe lleva poppler adentro para que el usuario final no tenga que
          # instalarlo (ver _resolver_poppler_path en server.py). Se toma el ULTIMO
          # release de poppler-windows en vez de fijar una version: asi el build no se
          # rompe solo el dia que esa version deje de estar publicada.
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -like "Release-*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No encontre el .zip de poppler en el ultimo release" }
          Write-Host "Usando $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile poppler.zip
          Expand-Archive poppler.zip -DestinationPath C:\poppler -Force
          $bin = Get-ChildItem C:\poppler -Recurse -Directory -Filter bin | Where-Object { $_.FullName -like "*Library\bin" } | Select-Object -First 1
          if (-not $bin) { throw "No encontre Library\bin dentro del zip de poppler" }
          # El .spec lee esta variable para decidir que carpeta de poppler empaquetar.
          "POPPLER_BIN_SOURCE=$($bin.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # OJO: cada comando va en su PROPIO paso. En un paso de pwsh con varios comandos
      # solo cuenta el codigo de salida del ULTIMO, y eso ya dejo pasar un build roto:
      # la instanciacion del motor fallaba, pero como el comando siguiente terminaba
      # bien, el paso quedaba verde y el .exe se publicaba sin OCR.
      - name: Precargar los modelos de OCR
        shell: pwsh
        run: |
          # rapidocr NO trae los .onnx dentro del paquete: los descarga la primera vez
          # que se instancia el motor, hacia site-packages/rapidocr/models/. El .spec los
          # mete al build con collect_data_files("rapidocr"), asi que si no se descargan
          # ANTES de compilar, el .exe sale sin modelos y la app fallaria (o exigiria
          # internet) la primera vez que el usuario final audite algo.
          python -c "import numpy as np; from rapidocr import RapidOCR; RapidOCR()(np.full((320,320,3),255,dtype=np.uint8))"

      - name: Revisar que los modelos quedaron descargados
        shell: pwsh
        run: |
          python -c "import os, rapidocr; d=os.path.join(os.path.dirname(rapidocr.__file__),'models'); fs=[f for f in (os.listdir(d) if os.path.isdir(d) else []) if f.endswith('.onnx')]; print('modelos:', fs); raise SystemExit(0 if len(fs) >= 3 else f'Se esperaban 3 modelos (det, cls, rec) y hay {len(fs)}')"

      - name: Revisar que el motor de OCR se puede ejecutar
        shell: pwsh
        run: |
          # onnxruntime es lo que EJECUTA los modelos, y rapidocr no lo declara como
          # dependencia suya. Si falta, esto revienta aca y no en la maquina del usuario.
          python -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__, onnxruntime.get_available_providers())"
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime no se puede importar" }
          # Tiene que ser la variante DirectML: es la que permite medir CPU contra GPU en
          # la maquina del usuario. Con el onnxruntime normal la app funciona, pero se
          # queda en CPU para siempre sin avisar.
          python -c "import onnxruntime as ort, sys; sys.exit(0 if 'DmlExecutionProvider' in ort.get_available_providers() else 'Falta DmlExecutionProvider: se instalo el onnxruntime normal en vez de onnxruntime-directml')"
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime sin soporte de GPU (DirectML)" }
          python -c "import fitz; print('PyMuPDF (fitz) OK')"
          if ($LASTEXITCODE -ne 0) { throw "PyMuPDF no se puede importar como 'fitz'" }

      - name: Compilar con PyInstaller
        shell: pwsh
        run: pyinstaller AuditoriaCedulas.spec

      - name: Revisar que el build quedo completo
        shell: pwsh
        run: |
          # Un .exe que compila pero sale sin poppler o sin modelos arranca igual y recien
          # falla cuando el usuario intenta auditar. Mejor que reviente aca.
          if (-not (Test-Path "dist\AuditoriaCedulas\AuditoriaCedulas.exe")) { throw "No se genero el .exe" }

          $poppler = Get-ChildItem "dist\AuditoriaCedulas" -Recurse -Filter "pdftoppm.exe" | Select-Object -First 1
          if (-not $poppler) { throw "El build salio SIN poppler: no podria convertir el PDF a imagenes" }

          $modelos = @(Get-ChildItem "dist\AuditoriaCedulas" -Recurse -Filter "*.onnx")
          if ($modelos.Count -lt 3) { throw "Se esperaban 3 modelos de OCR (det, cls, rec) y hay $($modelos.Count)" }

          # Los modelos sin su motor no sirven de nada: es exactamente el .exe que se
          # publico roto una vez -- traia los tres .onnx y ni un archivo de onnxruntime.
          $ort = @(Get-ChildItem "dist\AuditoriaCedulas" -Recurse -Filter "onnxruntime*")
          if ($ort.Count -lt 1) { throw "El build salio SIN onnxruntime: los modelos no se podrian ejecutar" }

          $mupdf = @(Get-ChildItem "dist\AuditoriaCedulas" -Recurse -Filter "*pymupdf*")
          if ($mupdf.Count -lt 1) { throw "El build salio SIN PyMuPDF: se pierde la lectura de PDFs con texto digital" }

          # Sin esto el .exe arranca, cae al navegador y queda sin forma visible de
          # cerrarse (no hay consola). Se revisa pywebview y el puente a .NET aparte:
          # falta cualquiera de los dos y no hay ventana.
          $webview = @(Get-ChildItem "dist\AuditoriaCedulas" -Recurse -Filter "webview*")
          if ($webview.Count -lt 1) { throw "El build salio SIN pywebview: no se abriria la ventana de la app" }
          $clr = @(Get-ChildItem "dist\AuditoriaCedulas" -Recurse -Include "clr*.pyd", "Python.Runtime.dll")
          if ($clr.Count -lt 1) { throw "El build salio SIN pythonnet: pywebview no podria crear la ventana en Windows" }

          # El .dll solo NO alcanza: .NET necesita su deps.json al lado para encontrar el
          # punto de entrada. Faltando ese archivo el build pasa, el .exe arranca, y la
          # ventana falla en silencio cayendo al navegador. Ya paso una vez.
          $deps = @(Get-ChildItem "dist\AuditoriaCedulas" -Recurse -Filter "Python.Runtime.deps.json")
          if ($deps.Count -lt 1) { throw "Falta Python.Runtime.deps.json: la ventana de la app no abriria" }

          Write-Host "poppler:     $($poppler.FullName)"
          Write-Host "modelos OCR: $($modelos.Count)"
          Write-Host "onnxruntime: $($ort.Count) archivos"
          Write-Host "PyMuPDF:     $($mupdf.Count) archivos"

      - name: Empaquetar el .zip y calcular su SHA-256
        shell: pwsh
        run: |
          # El nombre tiene que coincidir con el link de descarga del README.
          Compress-Archive -Path "dist\AuditoriaCedulas" -DestinationPath "AuditoriaCedulas-Windows.zip" -Force
          $hash = (Get-FileHash "AuditoriaCedulas-Windows.zip" -Algorithm SHA256).Hash
          # El hash se publica para que quien desconfie del binario pueda verificar que lo
          # que descargo es exactamente lo que salio de este build.
          "$hash  AuditoriaCedulas-Windows.zip" | Set-Content "AuditoriaCedulas-Windows.zip.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Publicar el resultado del build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: AuditoriaCedulas-Windows
          path: |
            AuditoriaCedulas-Windows.zip
            AuditoriaCedulas-Windows.zip.sha256

      # ------------------------------------------------------------------------------
      # Firma de codigo (SignPath Foundation) -- descomentar CUANDO aprueben el proyecto.
      #
      # Es lo unico que quita el "Editor desconocido" de SmartScreen, y lo que mas baja
      # los falsos positivos de los antivirus. SignPath toma el artifact que se subio
      # arriba, lo firma, y devuelve el mismo paquete firmado. Los identificadores de
      # abajo los entrega SignPath al aprobar el proyecto; el token va en
      # Settings > Secrets and variables > Actions, con el nombre SIGNPATH_API_TOKEN.
      #
      # OJO: al firmar, el binario CAMBIA -- hay que recalcular el SHA-256 despues de
      # este paso y publicar ese, no el que se calculo mas arriba.
      #
      # - name: Firmar con SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<lo entrega SignPath>"
      #     project-slug: "<lo entrega SignPath>"
      #     signing-policy-slug: "release-signing"
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: "firmado"
      # ------------------------------------------------------------------------------

      - name: Crear el release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hash = (Get-Content "AuditoriaCedulas-Windows.zip.sha256").Split(" ")[0]
          $lineas = @(
            "Descarga: AuditoriaCedulas-Windows.zip",
            "",
            "SHA-256:",
            $hash,
            "",
            "Para verificarlo en Windows antes de ejecutarlo:",
            "    Get-FileHash AuditoriaCedulas-Windows.zip -Algorithm SHA256",
            "",
            "Compilado automaticamente por GitHub Actions desde el codigo de este repositorio."
          )
          $lineas -join [Environment]::NewLine | Set-Content notas-release.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "AuditoriaCedulas-Windows.zip" "AuditoriaCedulas-Windows.zip.sha256" --title $env:GITHUB_REF_NAME --notes-file notas-release.md
